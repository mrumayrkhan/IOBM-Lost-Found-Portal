<!DOCTYPE html>
<html lang="en">
<head>
    <title>Management Portal</title>
    <style>
        :root { --accent: #ff0000; }
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: var(--accent); color: white; }
        .logout { color: red; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between;">
        <h1>Management Portal</h1>
        <a href="index.html" class="logout">Logout</a>
    </div>
    <table>
        <thead>
            <tr><th>Item Name</th><th>Location</th><th>Status</th></tr>
        </thead>
        <tbody>
            <tr><td>Scientific Calculator</td><td>Library</td><td style="color:green">Found</td></tr>
            <tr><td>Black Wallet</td><td>Cafeteria</td><td style="color:red">Lost</td></tr>
        </tbody>
    </table>
</body>
</html>
