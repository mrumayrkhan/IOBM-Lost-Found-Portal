<!DOCTYPE html>
<html lang="en">
<head>
    <title>IOBM Portal - Home</title>
    <style>
        :root { --accent: #ff0000; }
        body { font-family: "Segoe UI", sans-serif; margin: 0; background: url("https://theazb.com/wp-content/uploads/2024/04/IoBM-Campus-Picture-1.jpg") no-repeat center center/cover; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .overlay { background: rgba(0,0,0,0.6); position: absolute; inset: 0; }
        .content { position: relative; z-index: 2; text-align: center; color: white; }
        .portal-options { display: flex; gap: 20px; margin-top: 30px; }
        .portal-card { background: var(--accent); color: white; padding: 40px; width: 250px; border-radius: 12px; text-decoration: none; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .portal-card:hover { transform: translateY(-10px); background: #cc0000; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="content">
        <h1>IOBM Lost & Found System</h1>
        <div class="portal-options">
            <a href="student.html" class="portal-card">
                <h2>Student Portal</h2>
                <p>Report Lost or Found Items</p>
            </a>
            <a href="management.html" class="portal-card">
                <h2>Management Portal</h2>
                <p>Admin Control Panel</p>
            </a>
        </div>
    </div>
</body>
</html>
