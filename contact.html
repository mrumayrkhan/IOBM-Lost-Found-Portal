<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Support</title>
    <style>
        :root { --accent: #ff0000; }
        body { font-family: sans-serif; background: #f4f4f4; padding: 50px; }
        .form-container { 
            max-width: 400px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
        }
        h2 { color: var(--accent); text-align: center; }
        input, textarea { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            box-sizing: border-box;
        }
        .btn-send { 
            background: var(--accent); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 12px; 
            cursor: pointer; 
            font-size: 16px; 
            border-radius: 5px;
        }
        .back-link { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #666; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Help & Support</h2>
        <form action="https://formspree.io/f/mykgrajg" method="POST">
            <label>Your Name:</label>
            <input type="text" name="name" required placeholder="Enter your name">

            <label>Your Email:</label>
            <input type="email" name="email" required placeholder="Enter your email">

            <label>Message:</label>
            <textarea name="message" rows="4" required placeholder="How can we help?"></textarea>

            <button type="submit" class="btn-send">Send Message</button>
        </form>
        <a href="index.html" class="back-link">Back to Home</a>
    </div>

</body>
</html>
